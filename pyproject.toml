[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "food-recsys"
version = "0.1.0"
description = "Food.com kNN / weighted kNN recipe recommender (CME 4403 term project)"
requires-python = ">=3.10"
# Lower bounds only (see requirements.txt): Colab ships these preinstalled and pinning would
# force reinstalls that can break the runtime. Each output manifest records the git commit and the
# exact library versions; loading a pickled object checks them.
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.6",
    "matplotlib>=3.10",
    "pyarrow>=14",
    "pyyaml>=6",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "python-docx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
