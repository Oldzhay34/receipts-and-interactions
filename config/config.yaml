# Project configuration: no hard-coded paths or magic numbers in code.
# All paths under `paths` are RELATIVE to the DATA_ROOT environment variable,
# except `local_sample_dir`, which is relative to the repository root.
# Later stages ADD their own top-level blocks (e.g. `outliers:` in 1.4); they do not edit existing ones.

project: food-recsys
random_state: 42

paths:
  raw_dir: raw
  raw_recipes: raw/RAW_recipes.csv
  raw_interactions: raw/RAW_interactions.csv
  outputs_dir: outputs
  local_sample_dir: data/sample   # repo-relative copy of outputs/sample/<LATEST>/

split:
  train: 0.70
  val: 0.15
  test: 0.15

# Stage names = folder names under outputs/.
# ArtifactStore refuses unknown stages.
stages:
  - loaded            # 1.0
  - sample            # 1.0
  - exploration       # 1.1
  - quality           # 1.2
  - missing           # 1.3
  - outliers          # 1.4
  - ingredients       # 1.5
  - figures           # 1.6
  - binning           # 1.7
  - scaling           # 1.8
  - splits            # 1.9
  - pipeline          # 1.9
  - knn_prototype     # 1.10
  - modeling          # P2
  - personalization   # P3

load:
  # Only empty CSV fields are missing. pandas' default NA list would also turn literal
  # text such as "None", "NA" or "null" in names/reviews into NaN.
  na_values: [""]

sample:
  n_recipes: 5000
  stratify_col: n_ingredients

ingredients:
  # modifiers: words stripped from ingredient names. "sweet" and "hot" are deliberately absent:
  # they change the ingredient (sweet potato, hot sauce).
  min_count: 10
  encoding_strategy: "binary"
  modifiers:
    - fresh
    - freshly
    - dried
    - dry
    - chopped
    - finely
    - coarsely
    - minced
    - sliced
    - diced
    - grated
    - shredded
    - crushed
    - ground
    - whole
    - large
    - medium
    - small
    - extra
    - virgin
    - cold
    - warm
    - frozen
    - thawed
    - canned
    - drained
    - rinsed
    - peeled
    - seeded
    - pitted
    - boneless
    - skinless
    - unsalted
    - salted
    - raw
    - cooked
    - roasted
    - toasted
    - melted
    - softened
    - room temperature
    - optional
    - to taste  

binning:
  minutes:
    strategy: domain
    edges: [0, 30, 60, .inf]
    labels: ["quick", "medium", "long"]
    output_col: minutes_bin
    right: false          # [a, b): quick < 30, medium 30-59, long >= 60
  calories:
    strategy: equal_frequency
    n_bins: 3
    labels: ["low", "medium", "high"]
    output_col: calories_bin
  avg_rating:
    strategy: domain
    edges: [0, 3.5, 4.5, 5.0]
    labels: ["low", "medium", "high"]
    output_col: rating_class    
# Outlier treatment (1.4). `columns` lists the strategies applied to each column; they always
# run in the order invalid_rule -> quantile_clip -> log1p (recsys.cleaning.outliers.STEP_ORDER).
# invalid_rule: domain bounds [lower, upper] (null = no bound); values outside become NaN.
#   minutes upper = 30 days in minutes: longer values are data-entry errors, not recipes.
# quantile_clip: bounds learned from TRAIN data only (1.9 pipeline).
# log1p: only for columns still strongly right-skewed (skew > 1) after clipping.
outliers:
  invalid_rule:
    minutes: [0, 43200]
    n_steps: [1, null]
    n_ingredients: [1, null]
    calories: [0, null]
    total_fat_pdv: [0, null]
    sugar_pdv: [0, null]
    sodium_pdv: [0, null]
    protein_pdv: [0, null]
    saturated_fat_pdv: [0, null]
    carbohydrates_pdv: [0, null]
  quantile_clip:
    lower_q: 0.0
    upper_q: 0.99
  columns:
    minutes: [invalid_rule, quantile_clip, log1p]
    n_steps: [invalid_rule, quantile_clip, log1p]
    n_ingredients: [invalid_rule, quantile_clip]
    calories: [invalid_rule, quantile_clip, log1p]
    total_fat_pdv: [invalid_rule, quantile_clip, log1p]
    sugar_pdv: [invalid_rule, quantile_clip, log1p]
    sodium_pdv: [invalid_rule, quantile_clip, log1p]
    protein_pdv: [invalid_rule, quantile_clip, log1p]
    saturated_fat_pdv: [invalid_rule, quantile_clip, log1p]
    carbohydrates_pdv: [invalid_rule, quantile_clip, log1p]

# Numeric scaling (1.8): recsys.features.scaling.build_numeric_scaler(cfg.section("scaling")).
# Fitted on TRAIN data only in the 1.9 pipeline.
scaling:
  method: minmax          # minmax | zscore
  use_log1p: true
  numeric_weight: 0.2     # WeightedCombinedDistance: share of the numeric distance

# Splits (1.9). RAW_recipes is never split; RAW_interactions is split two ways. Ratios: `split`.
splits:
  stratify_unrated_label: unrated   # stratification class of recipes without any rating > 0
  class_share_tolerance: 0.01       # max |class share difference| between train / val / test
  temporal:
    min_interactions: 5             # users with fewer interactions stay entirely in train
    n_val: 1                        # last-but-n_test interactions -> val
    n_test: 1                       # latest interactions -> test
  dev_sample:
    n_recipes: 30000                # stratified on the stratification class

# Preprocessing pipeline (1.9): steps are built from the registry (kind / name) in this order and
# fitted on TRAIN data only. A value {ref: a.b.c} is read from that path of this file, so the
# pipeline reuses the 1.3-1.8 blocks instead of copying them. `optional: true` = skip (and record
# the skip) when the registry has no such component yet.
pipeline:
  interaction_steps:
    - {kind: missing, name: rating_zero_to_nan, params: {column: rating}}
  target:                  # recipe targets; the class binner is fitted on train avg_rating only
    kind: targets
    name: recipe
    params:
      class_col: {ref: binning.avg_rating.output_col}
      binner:                # a nested step: built from the registry too
        kind: binner
        name: {ref: binning.avg_rating.strategy}
        params:
          column: avg_rating
          edges: {ref: binning.avg_rating.edges}
          labels: {ref: binning.avg_rating.labels}
          output_col: {ref: binning.avg_rating.output_col}
  recipe_steps:
    - {kind: missing, name: zero_as_missing, params: {columns: [minutes]}}
    - {kind: outlier, name: invalid_rule, params: {bounds: {ref: outliers.invalid_rule}}}
    - {kind: imputer, name: group_median, params: {target_col: minutes, steps_col: n_steps}}
    - {kind: imputer, name: group_median, params: {target_col: n_steps, steps_col: n_ingredients}}
    - {kind: imputer, name: group_median, params: {target_col: n_ingredients, steps_col: n_steps}}
    - kind: outlier
      name: quantile_clip
      params:
        columns: [minutes, n_steps, n_ingredients, calories, total_fat_pdv, sugar_pdv,
                  sodium_pdv, protein_pdv, saturated_fat_pdv, carbohydrates_pdv]
        lower_q: {ref: outliers.quantile_clip.lower_q}
        upper_q: {ref: outliers.quantile_clip.upper_q}
    - kind: binner
      name: {ref: binning.minutes.strategy}
      params:
        column: minutes
        edges: {ref: binning.minutes.edges}
        labels: {ref: binning.minutes.labels}
        output_col: {ref: binning.minutes.output_col}
        right: {ref: binning.minutes.right}
    - kind: binner
      name: {ref: binning.calories.strategy}
      params:
        column: calories
        n_bins: {ref: binning.calories.n_bins}
        labels: {ref: binning.calories.labels}
        output_col: {ref: binning.calories.output_col}
    - kind: outlier
      name: log1p
      params:
        columns: [minutes, n_steps, calories, total_fat_pdv, sugar_pdv, sodium_pdv,
                  protein_pdv, saturated_fat_pdv, carbohydrates_pdv]
    # 1.8 scaler (registry kind "scaler": minmax | zscore). log1p is already applied above, so the
    # scaler does not take the log again.
    - kind: scaler
      name: {ref: scaling.method}
      params:
        columns: [minutes, n_steps, n_ingredients, calories, total_fat_pdv, sugar_pdv,
                  sodium_pdv, protein_pdv, saturated_fat_pdv, carbohydrates_pdv]
  ingredient_steps:
    - kind: ingredients
      name: normalizer
      params: {modifiers: {ref: ingredients.modifiers}}
    - kind: ingredients
      name: rare_filter
      params: {min_count: {ref: ingredients.min_count}}
  ingredient_encoder:
    kind: ingredients
    name: encoder
    params: {strategy: {ref: ingredients.encoding_strategy}}

# Class imbalance (1.9): applied to TRAIN only (recsys.imbalance.resampling).
resampling:
  strategy: none            # none | random_under | random_over (class weights are always reported)

# kNN prototype (1.10). Ingredient distance only (4.5: Jaccard / cosine, never Euclidean).
# Untuned prototype values: k and the metric are tuned on validation in P2.
knn_prototype:
  metric: jaccard               # registry kind "distance": jaccard | cosine
  n_neighbors: 15               # rating-class kNN (uniform and distance-weighted)
  rating_neighbors: 10          # neighbours of the rating estimate for unrated recipes
  distance_eps: 1.0e-6          # weight 1 / (d + eps) keeps identical ingredient sets finite
  batch_size: 512               # query rows per distance block
  top_k: 5                      # results per example query
  example_queries:
    - {id: q1, ingredients: [chicken, garlic, lemon]}
    - {id: q2, ingredients: [flour, sugar, butter, eggs]}
    - {id: q3, ingredients: [tomatoes, basil, mozzarella, olive oil], filters: {minutes_bin: quick}}
